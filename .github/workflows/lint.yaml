name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    if: github.head_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install linters
        run: npm install --no-save html-validate stylelint stylelint-config-standard

      - name: Lint HTML
        run: npx html-validate "**/*.html"

      - name: Lint CSS
        run: npx stylelint "**/*.css"