<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shir and Elizabeth's Coffee Shop — Flexbox Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1>Shir and Elizabeth's Coffee Shop</h1>
    <p class="subtitle">Arrange the counter with Flexbox</p>
  </header>

  <!-- Static hint, not the per-level instruction (that's #instruction below) -->
  <p class="board-hint">Pick Flexbox values from the panel and arrange the items to match the order.</p>

  <main class="game-layout">

    <section class="board-column">

      <!-- The board: the flex container itself. The logic adds/removes a class here based on the player's solution. -->
      <div class="board-wrapper">
        <div id="board"></div>
      </div>

    </section>

    <!-- Control panel: everything the logic reads from and writes to -->
    <aside class="control-panel">

      <p id="level-counter">Level 1 of 8</p>

      <!-- Built dynamically by renderLevelNav() -->
      <nav id="level-nav" aria-label="Level navigation"></nav>

      <p id="instruction">Loading instructions...</p>

      <!-- Intentionally empty — the logic generates the selects into it based on the current level's controls -->
      <div id="controls"></div>

      <p id="attempts">Attempts: 0</p>

      <!-- Intentionally empty — the logic writes the success/error message here and adds class .success or .error -->
      <div id="feedback" aria-live="polite"></div>

      <div class="button-row">
        <button id="check-btn" type="button">Check</button>
        <!-- Hidden by default via class="hidden"; the logic reveals it after a few wrong attempts on the current level -->
        <button id="hint-btn" type="button" class="hidden">Hint</button>
        <button id="reset-btn" type="button">Reset Level</button>
        <!-- Hidden by default via class="hidden"; the logic reveals it on success -->
        <button id="next-btn" type="button" class="hidden">Next Level</button>
        <!-- Hidden by default via class="hidden"; the logic reveals it only on the game-complete screen -->
        <button id="restart-btn" type="button" class="hidden">Play Again</button>
      </div>

    </aside>

  </main>

  <script src="levels.js"></script>
  <script src="script.js"></script>

</body>
</html>
